<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AKA Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login and register.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="auth-logo">
            <img src="image/logo2.jpg" alt="AKA Shop">
        </a>

        <!-- LOGIN -->
        <div class="Login-box" id="loginBox">
            <h1>Đăng nhập</h1>
            <p class="subtitle">Chào mừng bạn quay lại AKA Shop</p>
            <form id="loginForm">
                
                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Nhập email của bạn"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Nhập mật khẩu"
                        required
                    >
                </div>
                <button type="submit">Đăng nhập</button>
                <p class="message" id="loginMessage"></p>
            </form>
            <p class="switch">
                Chưa có tài khoản?
                <span onclick="window.location.href='register.html'">Đăng ký ngay</span>
                <br>
                <a href="index.html" class="back-home">← Về trang chủ</a>
            </p>
        </div>
    
    </div>
    <script type="module" src="login-firebase.js"></script>
</body>
