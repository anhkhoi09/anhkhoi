<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AKA Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login and register.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="auth-logo">
            <img src="image/logo2.jpg" alt="AKA Shop">
        </a>

        <!-- REGISTER -->
        <div class="Register-box" id="registerBox">
            <h1>Đăng ký</h1>
            <p class="subtitle">Tạo tài khoản mới của bạn</p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Tên</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Nhập tên của bạn"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Nhập email của bạn"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Tạo mật khẩu"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Nhập lại mật khẩu</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >
                </div>

                <button type="submit">Đăng ký</button>
                
                <p class="message" id="registerMessage"></p>

            </form>

            <p class="switch">
                Đã có tài khoản?
                <span onclick="window.location.href='login.html'">Đăng nhập ngay</span>
                <br>
                <a href="index.html" class="back-home">← Về trang chủ</a>
            </p>
        </div>

    </div>
    <script type="module" src="register-firebase.js"></script>
</body>
</html>
